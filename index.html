<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>รับโค้ดส่วนลดพิเศษ</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            background-color: #f7f7f7;
            padding: 20px;
            margin: 0;
        }
        .container {
            background: white;
            padding: 30px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            max-width: 400px;
            margin: 40px auto;
        }
        h2 { color: #333; }
        p { color: #666; font-size: 14px; line-height: 1.5; }
        
        /* ปรับแต่งปุ่มแชร์ให้ใหญ่และโดดเด่น */
        .btn {
            background-color: #06C755;
            color: white;
            border: none;
            padding: 18px 20px; /* เพิ่มความสูงของปุ่ม */
            font-size: 18px;     /* ขยายขนาดตัวอักษรให้ใหญ่ขึ้น */
            border-radius: 10px;
            cursor: pointer;
            width: 100%;         /* ขยายเต็มความกว้างกล่อง */
            margin-top: 20px;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(6, 199, 85, 0.3); /* เพิ่มเงาให้ปุ่มดูมีมิติ */
        }
        .btn:active { 
            background-color: #05b04c; 
            transform: scale(0.98); /* เอฟเฟกต์ยุบตัวเล็กน้อยตอนกด */
        }

        .coupon-box {
            display: none;
            margin-top: 20px;
            background: #fff9f9;
            border: 2px dashed #ff4d4d;
            padding: 15px;
            border-radius: 8px;
        }
        .code-text {
            font-size: 24px;
            color: #ff4d4d;
            font-weight: bold;
            margin: 10px 0;
        }
        .instruction {
            font-weight: bold;
            color: #d9534f;
            background: #fdf7f7;
            padding: 8px;
            border-radius: 4px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>🎁 รับส่วนลดพิเศษ</h2>
        <p id="desc">แชร์โปรโมชั่นให้เพื่อนอย่างน้อย 5 คนในครั้งเดียว เพื่อปลดล็อกโค้ดส่วนลดของคุณ</p>
        
        <!-- ปุ่มแชร์ขนาดใหญ่ -->
        <button id="shareBtn" class="btn" onclick="shareAndUnlock()">📤 แชร์ให้เพื่อนเลย</button>

        <!-- ส่วนแสดงโค้ดส่วนลด (ซ่อนไว้ก่อนจนกว่าจะแชร์สำเร็จ) -->
        <div id="couponSection" class="coupon-box">
            <h3>🎉 ยินดีด้วย! ปลดล็อกสำเร็จ</h3>
            <p>โค้ดส่วนลดของคุณคือ:</p>
            <div class="code-text">DISCOUNT100</div>
            <p>📅 <strong>ใช้ได้ถึงวันที่:</strong> <span id="expireDate"></span></p>
            <p class="instruction">📸 กรุณาแคปหน้าจอนี้ นำไปใช้ส่วนลดกับทางร้าน (ใช้ได้ภายใน 1 เดือนนับจากวันที่แชร์)</p>
        </div>
    </div>

    <script>
        async function main() {
            try {
                await liff.init({ liffId: "2010962484-4cvjVADF" }); // LIFF ID ของคุณ
                if (!liff.isLoggedIn()) {
                    liff.login();
                }
            } catch (error) {
                console.error("LIFF Init failed", error);
            }
        }
        main();

        async function shareAndUnlock() {
            if (!liff.isApiAvailable('shareTargetPicker')) {
                alert("กรุณาเปิดผ่านแอปพลิเคชัน LINE เท่านั้น");
                return;
            }

            try {
                const result = await liff.shareTargetPicker([
                    {
                        type: "text",
                        text: "🎁 แจกโปรโมชั่นส่วนลดพิเศษ! รีบกดรับสิทธิ์ก่อนหมดเขต: https://lin.ee/your_oa"
                    }
                ]);

                if (result) {
                    document.getElementById("shareBtn").style.display = "none";
                    document.getElementById("desc").style.display = "none";
                    
                    const today = new Date();
                    today.setMonth(today.getMonth() + 1);
                    
                    const options = { year: 'numeric', month: 'long', day: 'numeric', timeZone: 'Asia/Bangkok' };
                    const expireDateStr = today.toLocaleDateString('th-TH', options);
                    
                    document.getElementById("expireDate").innerText = expireDateStr;
                    document.getElementById("couponSection").style.display = "block";
                } else {
                    alert("คุณยกเลิกการแชร์ จึงยังไม่ได้รับโค้ดส่วนลด");
                }
            } catch (error) {
                console.error("Share failed", error);
                alert("เกิดข้อผิดพลาดในการแชร์: " + error);
            }
        }
    </script>
</body>
</html>
