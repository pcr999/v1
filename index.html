<!DOCTYPE html>
<html>
<head><script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script></head>
<body>
  <button onclick="share()">แชร์รับส่วนลด</button>
  <script>
    liff.init({ liffId: "YOUR_LIFF_ID" }).then(() => { if(!liff.isLoggedIn()) liff.login(); });
    async function share() {
      const res = await liff.shareTargetPicker([{type:"text", text:"รับส่วนลดพิเศษ! https://lin.ee/..."}]);
      if(res) alert("ยินดีด้วย! โค้ดส่วนลด: DISCOUNT50");
    }
  </script>
</body>
</html>
