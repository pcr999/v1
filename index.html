<style>
body {
  font-family: Arial, sans-serif;
  text-align: center;
  padding: 40px;
}

button {
  padding: 15px 25px;
  margin: 10px;

<a href="https://lin.ee/n1vpesS">
<button>

</button>
</a>


<script>

const LIFF_ID = "2010962484-gr4dOb9M";

liff.init({
  liffId: LIFF_ID
})
.then(() => {
  console.log("LIFF Ready");
});


function sharePromo(){

  liff.shareTargetPicker([

      type: "text",

    }
  ])
  .then(() => {

    document.getElementById("coupon").style.display="block";

  })
  .catch(err=>{
    alert("ไม่สามารถแชร์ได้");
    console.log(err);
  });

}


function getCoupon(){

 alert("ขอบคุณครับ รับคูปองส่วนลด 100 บาท");

}

</script>
