<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 40px; background: #f8fafc; }
    .btn { background: #06C755; color: white; padding: 12px 24px; border: none; border-radius: 8px; font-size: 18px; cursor: pointer; }
    .coupon-box { display: none; margin-top: 20px; padding: 20px; background: #dcfce7; border-radius: 8px; }
  </style>
</head>
<body>
  <h2>🎁 แชร์โปรโมชั่นรับส่วนลดพิเศษ</h2>
  <p>แชร์ให้เพื่อนใน LINE ของคุณ 5 คน เพื่อรับโค้ดส่วนลดทันที!</p>
  <button class="btn" id="shareBtn" onclick="shareToFriends()">แชร์ให้เพื่อนใน LINE</button>
  <div class="coupon-box" id="couponSection">
    <h3 style="color: #166534;">🎉 ยินดีด้วย! โค้ดส่วนลดของคุณคือ:</h3>
    <h1 style="color: #15803d; margin: 10px 0;">DISCOUNT50</h1>
  </div>
  <script>
    liff.init({ liffId: "YOUR_LIFF_ID" }).then(() => { if(!liff.isLoggedIn()) liff.login(); });
    async function shareToFriends() {
      if (!liff.isApiAvailable('shareTargetPicker')) { alert('กรุณาเปิดผ่านแอป LINE'); return; }
      const res = await liff.shareTargetPicker([{ type: "text", text: "แจกโปรโมชั่นส่วนลดพิเศษ! จากห้างทองพรเจริญเยาวราชหนองคาย รีบกดรับสิทธิ์: https://lin.ee/n1vpesS" }]);
      if (res) { document.getElementById('shareBtn').style.display = 'none'; document.getElementById('couponSection').style.display = 'block'; }
    }
  </script>
</body>
</html>
