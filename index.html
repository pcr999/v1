<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>รับคูปองส่วนลด</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body>
<h1>🎁 รับส่วนลด 100 บาท</h1>
<p id="status">
เพิ่มเพื่อน LINE พรเจริญเยาวราชหนองคาย เพื่อรับคูปอง
</p>
<button id="addFriend">
เพิ่มเพื่อน LINE เพื่อรับคูปอง
</button>
<h2 id="coupon" style="display:none;">
🎉 คูปองส่วนลด 100 บาท
</h2>
<script>
const LIFF_ID = "2010962484-gr4dOb9M";
async function main() {
  await liff.init({
    liffId: LIFF_ID
  });
  if (!liff.isLoggedIn()) {
    liff.login();
    return;
  }
  const friendship = await liff.getFriendship();
  if (friendship.friendFlag) {
    document.getElementById("coupon").style.display = "block";
    document.getElementById("status").innerHTML =
    "ขอบคุณที่เพิ่มเพื่อน พรเจริญเยาวราชหนองคายครับ";
  }
}
document.getElementById("addFriend").onclick = function(){
  window.location.href = "https://lin.ee/n1vpesS";
};
main();
</script>
</body>
</html>
