<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>รับโค้ดส่วนลดพิเศษ</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            background-color: #f7f7f7;
            padding: 20px;
            margin: 0;
        }
        .container {
            background: white;
            padding: 30px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            max-width: 400px;
            margin: 40px auto;
        }
        .profile-section {
            margin-bottom: 20px;
        }
        .profile-img {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #06C755;
            margin-bottom: 8px;
            display: none;
        }
        .profile-name {
            font-weight: bold;
            color: #333;
            font-size: 16px;
        }
        h2 { color: #333; font-size: 20px; margin-bottom: 10px; }
        
        .desc-text { 
            color: #222; 
            font-size: 16px; 
            font-weight: bold; 
            line-height: 1.5; 
            margin: 15px 0;
            background-color: #f0fdf4; 
            padding: 10px;
            border-radius: 8px;
            border: 1px dashed #06C755;
        }
        
        .btn {
            background-color: #06C755;
            color: white;
            border: none;
            padding: 18px 20px;
            font-size: 18px;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(6, 199, 85, 0.3);
        }
        .btn:active { 
            background-color: #05b04c; 
            transform: scale(0.98); 
        }

        .coupon-box {
            display: none;
            margin-top: 20px;
            background: #fff9f9;
            border: 2px dashed #ff4d4d;
            padding: 15px;
            border-radius: 8px;
        }
        .code-text {
            font-size: 24px;
            color: #ff4d4d;
            font-weight: bold;
            margin: 10px 0;
        }
        .instruction {
            font-weight: bold;
            color: #d9534f;
            background: #fdf7f7;
            padding: 8px;
            border-radius: 4px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- ส่วนแสดงรูปโปรไฟล์และชื่อ -->
        <div class="profile-section">
            <img id="userImage" class="profile-img" alt="Profile">
            <div id="userName" class="profile-name">ร้านทองพรเจริญเยาวราชหนองคาย</div>
        </div>

        <h2>🎁 รับส่วนลดพิเศษ</h2>
        
        <p id="desc" class="desc-text">แชร์โปรโมชั่นให้เพื่อนอย่างน้อย 5 คนในครั้งเดียว เพื่อรับโค้ดส่วนลดของคุณ</p>
        
        <button id="shareBtn" class="btn" onclick="shareAndUnlock()">📤 บอกต่อเพื่อนรับส่วนลด</button>

        <div id="couponSection" class="coupon-box">
            <h3>🎉 ยินดีด้วย! ปลดล็อกสำเร็จ</h3>
            <p>โค้ดส่วนลดของคุณคือ:</p>
            <div class="code-text">GOLD100</div>
            <p>📅 <strong>ใช้ได้ถึงวันที่:</strong> <span id="expireDate"></span></p>
            <p class="instruction">📸 กรุณาแคปหน้าจอนี้ นำไปใช้ส่วนลดที่ร้านทอง (ใช้ได้ภายใน 1 เดือน)</p>
        </div>
    </div>

    <script>
        async function main() {
            try {
                // ใช้ LIFF ID ของคุณจากภาพ (2010962484-4cvjVADF)
                await liff.init({ liffId: "2010962484-4cvjVADF" }); 
                
                if (!liff.isLoggedIn()) {
                    liff.login();
                } else {
                    // ดึงโปรไฟล์แบบปลอดภัย ถ้าติดปัญหาจะไม่ทำให้เว็บค้าง
                    try {
                        const profile = await liff.getProfile();
                        document.getElementById("userName").innerText = profile.displayName;
                        const userImg = document.getElementById("userImage");
                        userImg.src = profile.pictureUrl;
                        userImg.style.display = "inline-block";
                    } catch (err) {
                        console.log("Could not load profile", err);
                    }
                }
            } catch (error) {
                console.error("LIFF Init failed", error);
            }
        }
        main();

        async function shareAndUnlock() {
            if (!liff.isApiAvailable('shareTargetPicker')) {
                alert("กรุณาเปิดผ่านแอปพลิเคชัน LINE เท่านั้น");
                return;
            }

            try {
                const result = await liff.shareTargetPicker([
                    {
                        type: "text",
                        text: แกกก ฉันเพิ่งไปกดรับส่วนลดจากร้านทองพรเจริญเยาวราชหนองคายมา คุ้มมาก ลองกดรับสิทธิ์ดูนะ 👉 https://lin.ee/n1vpesS
                    }
                ]);

                if (result) {
                    document.getElementById("shareBtn").style.display = "none";
                    document.getElementById("desc").style.display = "none";
                    
                    const today = new Date();
                    today.setMonth(today.getMonth() + 1);
                    
                    const options = { year: 'numeric', month: 'long', day: 'numeric', timeZone: 'Asia/Bangkok' };
                    const expireDateStr = today.toLocaleDateString('th-TH', options);
                    
                    document.getElementById("expireDate").innerText = expireDateStr;
                    document.getElementById("couponSection").style.display = "block";
                } else {
                    alert("คุณยกเลิกการแชร์ จึงยังไม่ได้รับโค้ดส่วนลด");
                }
            } catch (error) {
                console.error("Share failed", error);
                alert("เกิดข้อผิดพลาดในการแชร์: " + error);
            }
        }
    </script>
</body>
</html>
