<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>รับโค้ดส่วนลดพิเศษ</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            background-color: #f7f7f7;
            padding: 20px;
            margin: 0;
        }
        .container {
            background: white;
            padding: 30px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            max-width: 400px;
            margin: 40px auto;
        }
        h2 { color: #333; font-size: 20px; margin-bottom: 10px; }
        
        .desc-text { 
            color: #222; 
            font-size: 16px; 
            font-weight: bold; 
            line-height: 1.5; 
            margin: 15px 0;
            background-color: #f0fdf4; 
            padding: 10px;
            border-radius: 8px;
            border: 1px dashed #06C755;
        }
        
        .btn {
            background-color: #06C755;
            color: white;
            border: none;
            padding: 18px 20px;
            font-size: 18px;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(6, 199, 85, 0.3);
        }
        .btn:active { 
            background-color: #05b04c; 
            transform: scale(0.98); 
        }

        .coupon-box {
            display: none;
            margin-top: 0;
            background: none;
            border: none;
            padding: 0;
        }
        
        /* สไตล์สำหรับรูปภาพโปสเตอร์ */
        .poster-image {
            width: 100%;
            height: auto;
            border-radius: 8px;
            display: block;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2 id="pageTitle">🎁 รับส่วนลดร้านทองพรเจริญเยาวราชหนองคาย</h2>
        
        <p id="desc" class="desc-text">แชร์โปรโมชั่นให้เพื่อนอย่างน้อย 5 คนในครั้งเดียว เพื่อรับโค้ดส่วนลดของคุณ</p>
        
        <!-- ปุ่มแชร์ -->
        <button id="shareBtn" class="btn" onclick="shareAndUnlock()">📤 บอกต่อเพื่อนรับส่วนลด</button>

        <!-- ส่วนแสดงรูปภาพโปสเตอร์ (ซ่อนไว้ก่อนจนกว่าจะแชร์สำเร็จ) -->
        <div id="couponSection" class="coupon-box">
            <img id="posterImg" src="https://raw.githubusercontent.com/pcr999/v1/main/pcr.jpg" alt="โปสเตอร์ส่วนลด" class="poster-image">
        </div>
    </div>

    <script>
        async function main() {
            try {
                await liff.init({ liffId: "2010962484-4cvjVADF" });
                if (!liff.isLoggedIn()) {
                    liff.login();
                }
            } catch (error) {
                console.error("LIFF Init failed", error);
            }
        }
        main();

        async function shareAndUnlock() {
            if (!liff.isApiAvailable('shareTargetPicker')) {
                alert("กรุณาเปิดผ่านแอปพลิเคชัน LINE เท่านั้น");
                return;
            }

            try {
                const result = await liff.shareTargetPicker([
                    {
                        type: "text",
                        text: "แนะนำ กดรับส่วนลดจากร้านทองพรเจริญเยาวราชหนองคาย คุ้มมาก กดรับสิทธิ์ได้เลย 👉 https://lin.ee/n1vpesS"
                    }
                ]);

                if (result) {
                    // ซ่อนปุ่ม หัวข้อ และคำอธิบายด้านบนทั้งหมด
                    document.getElementById("shareBtn").style.display = "none";
                    document.getElementById("desc").style.display = "none";
                    document.getElementById("pageTitle").style.display = "none";
                    
                    // ปรับแต่ง container ให้กระชับและแสดงแค่รูปภาพโปสเตอร์เต็มๆ
                    const container = document.querySelector(".container");
                    container.style.padding = "10px";
                    container.style.background = "transparent";
                    container.style.boxShadow = "none";

                    // แสดงรูปภาพโปสเตอร์
                    document.getElementById("couponSection").style.display = "block";
                } else {
                    alert("คุณยกเลิกการแชร์ จึงยังไม่ได้รับโค้ดส่วนลด");
                }
            } catch (error) {
                console.error("Share failed", error);
                alert("เกิดข้อผิดพลาดในการแชร์: " + error);
            }
        }
    </script>
</body>
</html>
