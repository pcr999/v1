<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>รับโค้ดส่วนลดพิเศษ</title>

    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: sans-serif;
            text-align: center;
            background-color: #f7f7f7;
            padding: 20px;
            margin: 0;
            overflow-x: hidden;
        }

        .container {
            background: white;
            padding: 30px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            max-width: 400px;
            margin: 40px auto;
        }

        h2 {
            color: #333;
            font-size: 20px;
            margin-bottom: 10px;
        }

        .desc-text {
            color: #222;
            font-size: 16px;
            font-weight: bold;
            line-height: 1.5;
            margin: 15px 0;
            background-color: #f0fdf4;
            padding: 10px;
            border-radius: 8px;
            border: 1px dashed #06C755;
        }

        .btn {
            background-color: #06C755;
            color: white;
            border: none;
            padding: 18px 20px;
            font-size: 18px;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(6, 199, 85, 0.3);
        }

        .btn:active {
            background-color: #05b04c;
            transform: scale(0.98);
        }

        /* ==============================
           โปสเตอร์หลังแชร์สำเร็จ
        ============================== */

        .coupon-box {
            display: none;
            margin-top: 20px;
        }

        .coupon-image {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.18);
        }

        /* ==============================
           หน้าจอเอฟเฟกต์รางวัล
        ============================== */

        #rewardOverlay {
            position: fixed;
            inset: 0;

            background:
                radial-gradient(
                    circle at center,
                    #ffffff 0%,
                    #fff8dc 35%,
                    #ffe59a 65%,
                    #ffffff 100%
                );

            display: none;

            align-items: center;
            justify-content: center;
            flex-direction: column;

            z-index: 9999;
            overflow: hidden;
        }

        /* ==============================
           กล่องของขวัญ
        ============================== */

        .gift {
            position: relative;
            width: 110px;
            height: 100px;
            margin-bottom: 20px;
            z-index: 5;
        }

        .gift-box {
            position: absolute;
            bottom: 0;
            left: 10px;

            width: 90px;
            height: 65px;

            background:
                linear-gradient(
                    135deg,
                    #d71920,
                    #9f0000
                );

            border-radius: 5px;

            box-shadow:
                0 8px 20px rgba(0,0,0,0.25);
        }

        .gift-box::before {
            content: "";

            position: absolute;

            left: 37px;
            top: 0;

            width: 16px;
            height: 65px;

            background: #ffd700;
        }

        .gift-lid {
            position: absolute;

            top: 20px;
            left: 4px;

            width: 102px;
            height: 22px;

            background:
                linear-gradient(
                    135deg,
                    #ed1c24,
                    #a40000
                );

            border-radius: 5px;

            z-index: 2;
        }

        .gift-lid::before {
            content: "";

            position: absolute;

            left: 43px;
            top: 0;

            width: 16px;
            height: 22px;

            background: #ffd700;
        }

        .gift-ribbon-left,
        .gift-ribbon-right {

            position: absolute;

            top: 0;

            width: 40px;
            height: 28px;

            border:
                7px solid #ffd700;

            border-radius: 50%;

            z-index: 3;
        }

        .gift-ribbon-left {
            left: 22px;
            transform: rotate(-25deg);
        }

        .gift-ribbon-right {
            right: 22px;
            transform: rotate(25deg);
        }

        /* ==============================
           กล่องเด้ง
        ============================== */

        .gift.ready {
            animation:
                giftBounce
                0.65s
                ease-in-out;
        }

        @keyframes giftBounce {

            0% {
                transform: scale(0.8);
            }

            50% {
                transform: scale(1.15);
            }

            75% {
                transform: scale(0.95);
            }

            100% {
                transform: scale(1);
            }

        }

        /* ==============================
           กล่องแตก
        ============================== */

        .gift.explode {
            animation:
                giftExplode
                0.5s
                ease
                forwards;
        }

        @keyframes giftExplode {

            0% {
                transform: scale(1);
                opacity: 1;
            }

            40% {
                transform: scale(1.35);
                opacity: 1;
            }

            100% {
                transform: scale(0.05);
                opacity: 0;
            }

        }

        /* ==============================
           แสงระเบิด
        ============================== */

        .reward-burst {

            position: absolute;

            width: 25px;
            height: 25px;

            border-radius: 50%;

            background: white;

            box-shadow:
                0 0 20px white,
                0 0 50px #ffd700,
                0 0 100px #ffb300;

            animation:
                burst
                1.5s
                ease-out
                forwards;
        }

        @keyframes burst {

            0% {
                width: 20px;
                height: 20px;
                opacity: 1;
            }

            35% {
                width: 150px;
                height: 150px;
                opacity: 0.95;
            }

            100% {
                width: 700px;
                height: 700px;
                opacity: 0;
            }

        }

        /* ==============================
           วงแหวนแสง
        ============================== */

        .ring {

            position: absolute;

            width: 80px;
            height: 80px;

            border:
                5px solid rgba(255,193,7,0.9);

            border-radius: 50%;

            animation:
                ringExplosion
                1.2s
                ease-out
                forwards;
        }

        @keyframes ringExplosion {

            0% {
                transform: scale(0.1);
                opacity: 1;
            }

            100% {
                transform: scale(8);
                opacity: 0;
            }

        }

        /* ==============================
           ข้อความปลดล็อก
        ============================== */

        .unlock-title {

            position: relative;

            z-index: 10;

            font-size: 32px;

            font-weight: bold;

            color: #8a5700;

            text-shadow:
                0 2px 0 white,
                0 0 15px rgba(255,215,0,0.7);

            opacity: 0;

            animation:
                titleAppear
                0.7s
                ease
                0.55s
                forwards;
        }

        .unlock-subtitle {

            position: relative;

            z-index: 10;

            font-size: 18px;

            color: #5f4300;

            margin-top: 8px;

            opacity: 0;

            animation:
                subtitleAppear
                0.6s
                ease
                0.9s
                forwards;
        }

        @keyframes titleAppear {

            0% {
                opacity: 0;
                transform: scale(0.5);
            }

            70% {
                opacity: 1;
                transform: scale(1.12);
            }

            100% {
                opacity: 1;
                transform: scale(1);
            }

        }

        @keyframes subtitleAppear {

            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }

        /* ==============================
           Confetti
        ============================== */

        .confetti {

            position: absolute;

            top: -30px;

            width: 8px;
            height: 15px;

            opacity: 0;

            animation:
                confettiFall
                linear
                forwards;
        }

        @keyframes confettiFall {

            0% {
                opacity: 1;

                transform:
                    translateY(-20px)
                    rotate(0deg);
            }

            100% {
                opacity: 0;

                transform:
                    translateY(110vh)
                    rotate(720deg);
            }

        }

        /* ==============================
           โปสเตอร์ปรากฏ
        ============================== */

        #finalCoupon {
