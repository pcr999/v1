<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>รับโค้ดส่วนลดพิเศษ</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            background-color: #f7f7f7;
            padding: 20px;
            margin: 0;
            overflow-x: hidden;
        }
        .container {
            background: white;
            padding: 30px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            max-width: 400px;
            margin: 40px auto;
            transition: all 0.5s ease;
        }
        h2 { color: #333; font-size: 20px; margin-bottom: 10px; }
        
        .desc-text { 
            color: #222; 
            font-size: 16px; 
            font-weight: bold; 
            line-height: 1.5; 
            margin: 15px 0;
            background-color: #f0fdf4; 
            padding: 10px;
            border-radius: 8px;
            border: 1px dashed #06C755;
        }
        
        .btn {
            background-color: #06C755;
            color: white;
            border: none;
            padding: 18px 20px;
            font-size: 18px;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(6, 199, 85, 0.3);
            transition: transform 0.1s;
        }
        .btn:active { 
            background-color: #05b04c; 
            transform: scale(0.98); 
        }

        .coupon-box {
            display: none;
            margin-top: 0;
            background: none;
            border: none;
            padding: 0;
        }
        
        .poster-image {
            width: 100%;
            height: auto;
            border-radius: 8px;
            display: block;
        }

        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
            display: none;
        }
    </style>
</head>
<body>

    <canvas id="confetti-canvas"></canvas>

    <div class="container">
        <h2 id="pageTitle">🎁 รับส่วนลดร้านทองพรเจริญเยาวราชหนองคาย</h2>
        
        <p id="desc" class="desc-text">แชร์โปรโมชั่นให้เพื่อนอย่างน้อย 5 คนในครั้งเดียว เพื่อรับโค้ดส่วนลดของคุณ</p>
        
        <button id="shareBtn" class="btn" onclick="shareAndUnlock()">📤 บอกต่อเพื่อนรับส่วนลด</button>

        <div id="couponSection" class="coupon-box">
            <img id="posterImg" src="https://raw.githubusercontent.com/pcr999/v1/main/pcr.jpg" alt="โปสเตอร์ส่วนลด" class="poster-image">
        </div>
    </div>

    <script>
        async function main() {
            try {
                await liff.init({ liffId: "2010962484-4cvjVADF" });
                if (!liff.isLoggedIn()) {
                    liff.login();
                }
            } catch (error) {
                console.error("LIFF Init failed", error);
            }
        }
        main();

        function triggerExcitement() {
            const canvas = document.getElementById('confetti-canvas');
            canvas.style.display = 'block';
            
            const myConfetti = confetti.create(canvas, {
                resize: true,
                useWorker: true
            });

            const count = 200;
            const defaults = {
                origin: { y: 0.7 }
            };

            function fire(particleRatio, opts) {
                myConfetti(Object.assign({}, defaults, opts, {
                    particleCount: Math.floor(count * particleRatio)
                }));
            }

            fire(0.25, {
                spread: 26,
                startVelocity: 55,
                origin: { x: 0.1, y: 0.5 }
            });
            fire(0.2, {
                spread: 60,
                origin: { x: 0.2, y: 0.6 }
            });
            
            fire(0.35, {
                spread: 100,
                decay: 0.91,
                scalar: 0.8,
                origin: { x: 0.5, y: 0.6 }
            });
            fire(0.1, {
                spread: 120,
                startVelocity: 25,
                decay: 0.92,
                scalar: 1.2,
                origin: { x: 0.5, y: 0.5 }
            });
            fire(0.1, {
                spread: 120,
                startVelocity: 45,
                origin: { x: 0.5, y: 0.5 }
            });
            
            fire(0.25, {
                spread: 26,
                startVelocity: 55,
                origin: { x: 0.9, y: 0.5 }
            });
            fire(0.2, {
                spread: 60,
                origin: { x: 0.8, y: 0.6 }
            });

            setTimeout(() => {
                canvas.style.display = 'none';
                myConfetti.reset();
            }, 5000);
        }

        async function shareAndUnlock() {
            if (!liff.isApiAvailable('shareTargetPicker')) {
                alert("กรุณาเปิดผ่านแอปพลิเคชัน LINE เท่านั้น");
                return;
            }

            try {
                const result = await liff.shareTargetPicker([
                    {
                        type: "text",
                        text: "แนะนำ กดรับส่วนลดจากร้านทองพรเจริญเยาวราชหนองคาย คุ้มมาก กดรับสิทธิ์ได้เลย 👉 https://lin.ee/n1vpesS"
                    }
                ]);

                if (result) {
                    document.getElementById("shareBtn").style.display = "none";
                    document.getElementById("desc").style.display = "none";
                    document.getElementById("pageTitle").style.display = "none";
                    
                    const container = document.querySelector(".container");
                    container.style.padding = "10px";
                    container.style.background = "transparent";
                    container.style.boxShadow = "none";

                    triggerExcitement();

                    setTimeout(() => {
                        document.getElementById("couponSection").style.display = "block";
                    }, 800);

                } else {
                    alert("คุณยกเลิกการแชร์ จึงยังไม่ได้รับโค้ดส่วนลด");
                }
            } catch (error) {
                console.error("Share failed", error);
            }
        }
    </script>
</body>
</html>
